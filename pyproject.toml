[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "hermes-lark"
version = "1.0.0"
description = "Feishu/Lark platform plugin for Hermes Agent"
readme = "README.md"
# Hermes Agent locks plugins into one uv workspace and intersects every
# member's requires-python, so an upper bound here breaks its lock.
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "hermes-lark contributors" },
]
keywords = ["agent", "feishu", "hermes-agent", "lark", "plugin"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Chat",
]
# Ranges, not pins: Hermes Agent resolves these together with its own exact
# pins, so the floors are the versions Hermes Agent 0.22.5 locks. The supported
# Hermes release is declared by requires_hermes in plugin.yaml; a hermes-agent
# requirement would be dropped by Hermes and cannot match its 0.0.0 metadata.
# Development tools live in requirements-dev.txt so they stay out of the
# Hermes dependency environment.
dependencies = [
  "aiohttp>=3.14.5,<4",
  "lark-oapi>=1.6.8,<2",
  "qrcode>=7.4.2,<9",
  "requests-toolbelt>=1.0.0,<2",
  "websockets>=15.0.1,<16",
]

[project.urls]
Changelog = "https://github.com/xc2/hermes-lark/blob/main/CHANGELOG.md"
Documentation = "https://github.com/xc2/hermes-lark#readme"
Issues = "https://github.com/xc2/hermes-lark/issues"
Source = "https://github.com/xc2/hermes-lark"

[project.entry-points."hermes_agent.plugins"]
"platforms/feishu" = "hermes_lark"

[tool.hatch.build.targets.sdist]
include = [
  "/.dockerignore",
  "/.env.example",
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/Dockerfile",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/SECURITY.md",
  "/THIRD_PARTY_NOTICES.md",
  "/__init__.py",
  "/compose.validation.yaml",
  "/docs",
  "/hermes_lark",
  "/permissions",
  "/plugin.yaml",
  "/pyproject.toml",
  "/requirements-dev.txt",
  "/scripts",
  "/skills",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["hermes_lark"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "hermes_lark/skills"
"permissions" = "hermes_lark/permissions"
"plugin.yaml" = "hermes_lark/plugin.yaml"
"THIRD_PARTY_NOTICES.md" = "hermes_lark/THIRD_PARTY_NOTICES.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
