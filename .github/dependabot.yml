version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Hermes Agent 0.19.1 pins packaging 26.0, which excludes Twine 7.
      - dependency-name: twine
        versions: [">=7"]
      # lark-oapi currently requires websockets below 16.
      - dependency-name: websockets
        versions: [">=16"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
