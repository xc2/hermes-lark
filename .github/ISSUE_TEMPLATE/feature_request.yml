name: Feature request
description: Propose a scoped behavior or compatibility improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem, not only the proposed implementation.
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: State the externally observable behavior and relevant security boundary.
    validations:
      required: true

  - type: input
    id: upstream
    attributes:
      label: Upstream reference
      description: Link the matching openclaw-lark code or issue when this is a parity request.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I reviewed the current parity document and existing issues.
          required: true
        - label: I did not include credentials, private message content, or document content.
          required: true
